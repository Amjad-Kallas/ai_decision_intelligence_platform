[project]
name = "decisionos"
version = "0.1.0"
description = "Codebase intelligence: ask questions about a Python repo, grounded in its code."
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.0.0",
    "networkx>=3.3",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/decisionos"]
